<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha do Dia - Balança PRIX 5</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            /* Imagem convertida diretamente em código Base64 para garantir carregamento */
            background-color: #0B132B;
            background-image: url('banner_mix_mateus_prix_clean.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Cartão translúcido centralizado */
        .card {
            background: rgba(16, 29, 56, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(237, 28, 36, 0.2);
            border: 2px solid rgba(237, 28, 36, 0.6);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #FFFFFF;
            font-size: 22px;
            line-height: 1.3;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info {
            color: #00F0FF;
            font-size: 15px;
            margin-top: 10px;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Destaque da Senha no padrão do Mix Mateus */
        .senha-box {
            background: linear-gradient(135deg, #ED1C24 0%, #A80C12 100%);
            color: #FFFFFF;
            font-size: 42px;
            font-weight: 800;
            padding: 20px;
            border-radius: 12px;
            letter-spacing: 4px;
            box-shadow: 0 6px 20px rgba(237, 28, 36, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .footer-tag {
            margin-top: 20px;
            color: #A0AEC0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Senha de Acesso do Dia<br>Balança PRIX 5</h2>
    <p class="info" id="data-atual">Carregando data...</p>
    
    <div class="senha-box" id="resultado">---</div>

    <div class="footer-tag">Automação Comercial & TI</div>
</div>

<script>
    function gerarSenhaHoje() {
        const hoje = new Date();
        
        // Pega dia e mês (adiciona '0' à esquerda se for menor que 10)
        const dia = String(hoje.getDate()).padStart(2, '0');
        const mes = String(hoje.getMonth() + 1).padStart(2, '0'); // Mês inicia em 0 no JS
        
        // Exibe a data legível na tela
        document.getElementById('data-atual').innerText = `Data: ${dia}/${mes}/${hoje.getFullYear()}`;
        
        // Junta dia e mês (ex: dia 15 e mês 09 vira o número 1509)
        const diaEMesNumero = parseInt(`${dia}${mes}`, 10);
        
        // Calcula a senha: 2011 + DiaMês
        const senha = 2011 + diaEMesNumero;
        
        // Exibe o resultado no elemento HTML
        document.getElementById('resultado').innerText = senha;
    }

    // Executa a função automaticamente assim que a página é carregada
    window.onload = gerarSenhaHoje;
</script>

</body>
</html>
